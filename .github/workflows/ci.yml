name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PORT: 3000
    steps:
      - uses: actions/checkout@v4

      # Node 22: vite-plugin-storybook-nextjs (Storybook tests and build) needs
      # node:module registerHooks, which Node 20 does not have.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Vitest unit tests
        run: npm test -- --run

      # The static export is what ships, and it is also what
      # e2e/legacy-playground-redirect.spec.ts reads to confirm the old route's
      # canonical and the absence of a meta refresh in the shipped HTML. `next
      # dev` never writes out/, so the build has to come first.
      - name: Build static export
        run: npm run build

      # Storybook is local-only (not deployed). Building it here makes a broken
      # story fail the PR instead of the next person who opens Storybook.
      - name: Build Storybook
        run: npm run build-storybook

      - name: Playwright E2E tests
        run: npm run test:e2e
